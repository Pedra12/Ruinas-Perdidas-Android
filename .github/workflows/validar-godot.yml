name: Validar projeto Godot e importar assets reais

on:
  workflow_dispatch:
  push:
    paths:
      - 'RuinasPerdidas/project.godot'
      - 'RuinasPerdidas/export_presets.cfg'
      - 'RuinasPerdidas/scenes/**'
      - 'RuinasPerdidas/scripts/**'
      - 'RuinasPerdidas/tools/**'
      - '*.zip'
      - '.github/workflows/validar-godot.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Converter o novo mapa FBX para GLB
        run: |
          sudo apt-get update
          sudo apt-get install -y curl xz-utils unzip
          curl -fL --retry 3 "https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz" -o /tmp/blender.tar.xz
          tar -xf /tmp/blender.tar.xz -C /tmp
          mkdir -p /tmp/zombie-pack RuinasPerdidas/assets/maps
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('mobile-game-low-poly-zombie-pack-scane-free.zip') as z:
              z.extract('source/Zombie-Pack.fbx', '/tmp/zombie-pack')
              z.extract('textures/internal_ground_ao_texture.jpeg', '/tmp/zombie-pack')
          PY
          cat > /tmp/convert_zombie_pack.py <<'PY'
          import bpy
          bpy.ops.wm.read_factory_settings(use_empty=True)
          bpy.ops.import_scene.fbx(filepath='/tmp/zombie-pack/source/Zombie-Pack.fbx')
          bpy.ops.export_scene.gltf(
              filepath='RuinasPerdidas/assets/maps/Zombie-Pack.glb',
              export_format='GLB',
              export_apply=True,
              export_yup=True,
              export_cameras=False,
              export_lights=False,
              export_animations=False
          )
          print('CONVERSAO CONCLUIDA: Zombie-Pack.glb')
          PY
          /tmp/blender-4.5.3-linux-x64/blender -b -t 2 --python /tmp/convert_zombie_pack.py
          test -s RuinasPerdidas/assets/maps/Zombie-Pack.glb
      - name: Baixar Godot 4.4.1
        run: |
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip" -o /tmp/godot.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --version
      - name: Validar importação, scripts e teste de fumaça
        run: |
          export GODOT=/tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          bash RuinasPerdidas/tools/validar.sh
          "$GODOT" --headless --path RuinasPerdidas --quit-after 180 res://scenes/main.tscn
      - name: Confirmar artefato convertido
        run: test -s RuinasPerdidas/assets/maps/Zombie-Pack.glb
      - name: Publicar assets extraídos e logs para auditoria
        uses: actions/upload-artifact@v4
        with:
          name: ruinas-perdidas-validacao-assets-godot
          path: |
            RuinasPerdidas/assets/maps/
          if-no-files-found: error
          retention-days: 14
