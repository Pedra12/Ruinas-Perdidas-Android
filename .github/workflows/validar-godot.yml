name: Validar projeto Godot e importar assets reais

on:
  workflow_dispatch:
  push:
    paths:
      - 'RuinasPerdidas/project.godot'
      - 'RuinasPerdidas/export_presets.cfg'
      - 'RuinasPerdidas/scenes/**'
      - 'RuinasPerdidas/scripts/**'
      - 'RuinasPerdidas/tools/**'
      - '*.zip'
      - '.github/workflows/validar-godot.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Instalar ferramentas de extração e texturas
        run: |
          sudo apt-get update
          sudo apt-get install -y 7zip python3-pil unzip
      - name: Baixar pacote Nature e mapa original do Release
        run: |
          curl -fL --retry 3 "https://github.com/Pedra12/Ruinas-Perdidas-Android/releases/download/V1.0.0/rua-bela-vista-29214-100-guarapari-sol-nascente-glb.zip" -o /tmp/mapa-cidade.zip
          mkdir -p RuinasPerdidas/assets/maps
          unzip -oq /tmp/mapa-cidade.zip -d /tmp/mapa-cidade
          install -m 644 /tmp/mapa-cidade/rua-bela-vista-29214-100-guarapari-sol-nascente.glb RuinasPerdidas/assets/maps/rua-bela-vista-29214-100-guarapari-sol-nascente.glb
          install -m 644 /tmp/mapa-cidade/miniskylines_attribution.txt RuinasPerdidas/assets/maps/miniskylines_attribution.txt
          install -m 644 /tmp/mapa-cidade/miniskylines_sources.json RuinasPerdidas/assets/maps/miniskylines_sources.json
          install -m 644 /tmp/mapa-cidade/README.txt RuinasPerdidas/assets/maps/README.txt
          test -s RuinasPerdidas/assets/maps/rua-bela-vista-29214-100-guarapari-sol-nascente.glb
      - name: Baixar Godot 4.4.1
        run: |
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip" -o /tmp/godot.zip
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --version
      - name: Validar importação, scripts e teste de fumaça
        run: |
          export GODOT=/tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          bash RuinasPerdidas/tools/validar.sh
          "$GODOT" --headless --path RuinasPerdidas --quit-after 180 res://scenes/main.tscn
      - name: Salvar assets extraídos no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RuinasPerdidas/assets/maps/
          if git diff --cached --quiet; then
            echo "Os assets já estão atualizados no repositório."
          else
            git commit -m "Add extracted original game assets"
            git stash push -u -m "temporary files from asset validation"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Publicar assets extraídos e logs para auditoria
        uses: actions/upload-artifact@v4
        with:
          name: ruinas-perdidas-validacao-assets-godot
          path: |
            RuinasPerdidas/assets/maps/
          if-no-files-found: error
          retention-days: 14
