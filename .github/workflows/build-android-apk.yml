name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-android-apk.yml'
      - 'RuinasPerdidas/project.godot'
      - 'RuinasPerdidas/export_presets.cfg'
      - 'RuinasPerdidas/scenes/**'
      - 'RuinasPerdidas/scripts/**'
      - 'RuinasPerdidas/tools/**'
      - 'RuinasPerdidas/assets/**'

concurrency:
  group: ruinas-perdidas-android-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools

      - name: Instalar componentes Android exigidos pelo Godot 4.4
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "ndk;28.1.13356709" \
            "cmake;3.10.2.4988404"

      - name: Instalar ferramentas e baixar mapa original
        run: |
          sudo apt-get update
          sudo apt-get install -y 7zip python3-pil unzip
          curl -fL --retry 3 "https://github.com/Pedra12/Ruinas-Perdidas-Android/releases/download/V1.0.0/Stylized.Nature.MegaKit.Standard.zip" -o Stylized.Nature.MegaKit.Standard.zip
          curl -fL --retry 3 "https://github.com/Pedra12/Ruinas-Perdidas-Android/releases/download/V1.0.0/rua-bela-vista-29214-100-guarapari-sol-nascente-glb.zip" -o /tmp/mapa-cidade.zip
          mkdir -p RuinasPerdidas/assets/maps
          unzip -oq /tmp/mapa-cidade.zip -d /tmp/mapa-cidade
          install -m 644 /tmp/mapa-cidade/rua-bela-vista-29214-100-guarapari-sol-nascente.glb RuinasPerdidas/assets/maps/rua-bela-vista-29214-100-guarapari-sol-nascente.glb
          test -s RuinasPerdidas/assets/maps/rua-bela-vista-29214-100-guarapari-sol-nascente.glb
          chmod +x RuinasPerdidas/tools/organizar_assets.sh
          (cd RuinasPerdidas && bash tools/organizar_assets.sh ..)

      - name: Baixar Godot 4.4.1 e templates oficiais
        run: |
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip" -o /tmp/godot.zip
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" -o /tmp/godot-templates.tpz
          mkdir -p /tmp/godot /tmp/godot-templates "$HOME/.local/share/godot/export_templates/4.4.1.stable" "$HOME/.config/godot"
          unzip -q /tmp/godot.zip -d /tmp/godot
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          if [ -f /tmp/godot-templates/templates/version.txt ]; then
            cp /tmp/godot-templates/templates/version.txt "$HOME/.local/share/godot/export_templates/4.4.1.stable/version.txt"
          else
            printf '4.4.1.stable' > "$HOME/.local/share/godot/export_templates/4.4.1.stable/version.txt"
          fi
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --version

      - name: Importar projeto e exportar APK arm64
        run: |
          GODOT=/tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          APK_PATH="$GITHUB_WORKSPACE/RuinasPerdidas/build/RuinasPerdidas.apk"
          mkdir -p "$GITHUB_WORKSPACE/RuinasPerdidas/build" "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          "$GODOT" --headless --path "$GITHUB_WORKSPACE/RuinasPerdidas" --import
          "$GODOT" --headless --path "$GITHUB_WORKSPACE/RuinasPerdidas" --script res://tools/inspecionar_modelos.gd | tee "$GITHUB_WORKSPACE/modelos-diagnostico.txt"
          "$GODOT" --headless --path "$GITHUB_WORKSPACE/RuinasPerdidas" --export-debug "Android" "$APK_PATH"
          test -s "$APK_PATH"
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging "$APK_PATH" | head -20
          ls -lh "$APK_PATH"

      - name: Publicar APK para instalação
        uses: actions/upload-artifact@v4
        with:
          name: Ruinas-Perdidas-Android-APK
          path: |
            RuinasPerdidas/build/RuinasPerdidas.apk
            modelos-diagnostico.txt
          if-no-files-found: error
          retention-days: 14
